# ==============================================================================
# Bantay Aso — Nginx Hardened Server Block Configuration
# Mitigates: PHP2Shell (CVE-2026-109618 / CVE-2026-109619), RCE, LFI, and OOM exploits
# Target: Virtualmin LEMP, Nginx Reverse Proxy, or Standalone LEMP Server
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name bantayaso.s3curity.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bantayaso.s3curity.net;

    root /home/bantayaso/public_html;
    index index.php index.html;

    # SSL Configuration (Replace paths with your certificates)
    # ssl_certificate /etc/letsencrypt/live/bantayaso.s3curity.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bantayaso.s3curity.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --------------------------------------------------------------------------
    # 1. PHP2Shell Mitigation: Drop multipart requests at web server layer
    # Since Bantay Aso is purely JSON/REST and standard forms, multipart is blocked.
    # --------------------------------------------------------------------------
    if ($content_type ~* "multipart/form-data") {
        return 415 '{"success":false,"error":"Multipart form-data processing is blocked by security policy (PHP2Shell defense)."}';
    }

    # Request size and buffer limits to prevent memory exhaustion
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 2. Strict Directory Isolation: Absolute Denial of Web Access
    # --------------------------------------------------------------------------
    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /dumps/ {
        deny all;
        return 404;
    }

    location ^~ /config/ {
        deny all;
        return 404;
    }

    location ^~ /includes/ {
        deny all;
        return 404;
    }

    location ^~ /scripts/ {
        deny all;
        return 404;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/ {
        deny all;
        return 404;
    }

    location ^~ /cache/ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 3. Execution Prevention: Disallow PHP / CGI in Static Assets
    # --------------------------------------------------------------------------
    location ~* ^/assets/.*\.ph(p[0-9]?|t|tml|ar)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # 4. Sensitive Files Denial (.env, .sqlite, .git, .sh, .lock, etc.)
    # --------------------------------------------------------------------------
    location ~* \.(sqlite|sqlite3|db|env.*|log|lock|ini|conf|bak|backup|old|ps1|sh|git.*)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 5. Routing Rewrites for Bantay Aso Endpoints
    # --------------------------------------------------------------------------
    location = /api/state {
        try_files /api/state.php$is_args$args =404;
    }

    location = /api/ui-state {
        try_files /api/ui-state.php$is_args$args =404;
    }

    location = /api/doctor {
        try_files /api/doctor.php$is_args$args =404;
    }

    location = /api/sync-files {
        rewrite ^ /api/sync.php?action=sync last;
    }

    location = /qa-dashboard {
        rewrite ^ /index.php?view=qa-dashboard last;
    }

    location = /qa-dashboard.html {
        rewrite ^ /index.php?view=qa-dashboard last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # 6. Secure PHP-FPM FastCGI Execution
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        # Strict existence check to prevent arbitrary file execution via pathinfo
        try_files $fastcgi_script_name =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust to your PHP-FPM socket
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY ""; # Mitigate httpoxy vulnerability
        
        # Buffer and timeout settings
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 30s;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 7. Enterprise Security Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
