# ==============================================================================
# Bantay Aso — Apache / Virtualmin Hardened VirtualHost Configuration
# Mitigates: PHP2Shell (CVE-2026-109618 / CVE-2026-109619), RCE, and LFI exploits
# ==============================================================================

<VirtualHost *:443>
    ServerName bantayaso.s3curity.net
    DocumentRoot /home/bantayaso/public_html

    # Security Options
    Options -Indexes -ExecCGI +FollowSymLinks

    # --------------------------------------------------------------------------
    # 1. PHP2Shell Mitigation: Drop multipart requests at web server level
    # --------------------------------------------------------------------------
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTP:Content-Type} multipart/form-data [NC]
        RewriteRule .* - [F,L]
    </IfModule>

    # --------------------------------------------------------------------------
    # 2. Strict Directory Isolation & Execution Prevention
    # --------------------------------------------------------------------------
    <Directory "/home/bantayaso/public_html">
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/home/bantayaso/public_html/data">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/dumps">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/config">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/includes">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/scripts">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/storage">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/uploads">
        Require all denied
    </Directory>

    <Directory "/home/bantayaso/public_html/cache">
        Require all denied
    </Directory>

    # Deny PHP script execution in assets directory
    <Directory "/home/bantayaso/public_html/assets">
        <FilesMatch "(?i)\.(ph(p[0-9]?|t|tml|ar)|cgi|pl|py|sh|bash|exe)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # --------------------------------------------------------------------------
    # 3. Enterprise Security Headers
    # --------------------------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    </IfModule>
</VirtualHost>
