; ==============================================================================
; Bantay Aso — Hardened PHP Configuration (PHP2Shell & RCE Defense)
; Mitigates: CVE-2026-109618, CVE-2026-109619, PHP-to-Shell & LFI/RCE vectors
; Compatible with: PHP 8.2+, 8.3+, 8.4+, 8.5+
; ==============================================================================

[PHP]
; ------------------------------------------------------------------------------
; 1. PHP2Shell Mitigation: Memory & Body Parser Bounds (CVE-2026-109618 & 19)
; ------------------------------------------------------------------------------
; CVE-2026-109618 / CVE-2026-109619 exploit controllable Out-Of-Memory (OOM)
; states during multipart body parsing, or engine memory exhaustion.
; Setting memory_limit = -1 eliminates the controllable OOM trigger threshold,
; while post_max_size bounds overall request payload size.
memory_limit = -1

; Conservative payload threshold (8M - 32M recommended range)
post_max_size = 16M

; Restrict multipart nesting depth and header/part limits to prevent parser DOS/OOM
max_input_nesting_level = 32
max_multipart_body_parts = 100
max_input_vars = 2000

; Maximum execution time bounds
max_execution_time = 30
max_input_time = 30

; ------------------------------------------------------------------------------
; 2. Stale Global State & Engine Corruption Neutralization
; ------------------------------------------------------------------------------
; Disable session upload progress tracking (eliminates stale global state attack paths)
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1

; Disable fatal error backtraces to prevent stale engine memory pointers/leaks
fatal_error_backtraces = 0

; ------------------------------------------------------------------------------
; 3. Dangerous Function Disabling (PHP-to-Shell Mitigation)
; ------------------------------------------------------------------------------
; Block shell execution primitives and low-level process spawners
disable_functions = exec,shell_exec,system,passthru,popen,proc_open,pcntl_exec,eval,dl,show_source,phpinfo,posix_getpwuid,posix_kill,syslog

; ------------------------------------------------------------------------------
; 4. Inclusion & File Access Controls (LFI / RFI Prevention)
; ------------------------------------------------------------------------------
; Disallow remote file inclusion via include/require
allow_url_include = Off

; Bantay Aso uses cURL for all remote HTTP queries; disallow fopen wrappers for URLs
allow_url_fopen = Off

; Enforce strict path resolution to prevent FastCGI execution bypasses
cgi.fix_pathinfo = 0

; Disable file uploads application-wide if multipart form data is unused
; (Bantay Aso is a JSON/REST API and static asset application; uploads are disabled by default)
file_uploads = Off
upload_max_filesize = 8M
max_file_uploads = 0

; ------------------------------------------------------------------------------
; 5. Information Disclosure & Error Handling
; ------------------------------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ------------------------------------------------------------------------------
; 6. Session & Cookie Security
; ------------------------------------------------------------------------------
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 86400
